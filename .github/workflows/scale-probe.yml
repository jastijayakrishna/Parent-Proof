# Scale test probe (scale/PREREG.md): counts each candidate consumer's real
# upgrades of its contract module since 2023 from git history alone. The
# verifier does not run here: these projects stay unseen until the test.
name: scale-probe
on:
  push:
    paths:
      - scale/candidates.json
  workflow_dispatch:
permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: ["1/8", "2/8", "3/8", "4/8", "5/8", "6/8", "7/8", "8/8"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/scale_probe.py "${{ matrix.part }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: probe-${{ strategy.job-index }}
          path: scale/probe/
          if-no-files-found: ignore

  commit:
    needs: probe
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: art
          pattern: probe-*
          merge-multiple: true
      - name: Commit the probe
        run: |
          mkdir -p scale/probe && cp art/*.json scale/probe/ 2>/dev/null || true
          git config user.name "proto-shadow"
          git config user.email "proto-shadow@users.noreply.github.com"
          git add scale/probe
          git diff --cached --quiet && exit 0
          git commit -q -m "Scale probe of $(date -u +%Y-%m-%dT%H:%MZ): upgrades per candidate pair, no verifier run"
          for i in $(seq 1 20); do
            if git pull -q --rebase -X theirs origin main && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 30
          done
          exit 1
