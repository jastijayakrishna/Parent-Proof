# The release gates of the verifier, on GitHub's machines instead of a laptop:
# every window of every suite in gates/suites decided by the pinned verifier
# (bin/) and judged against the compiler, the wire and the committed baseline
# (`verifier gate merge`), plus the scan of raft and etcd with the compiler.
# Runs when gates/request.txt changes, or by hand. Results are committed to
# gates/results/ and summarized as annotations.
name: gates
on:
  push:
    paths:
      - gates/request.txt
  workflow_dispatch:
permissions:
  contents: write
concurrency: gates

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      suites: ${{ steps.plan.outputs.suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Plan every suite
        id: plan
        run: |
          gunzip -c bin/verifier-linux-amd64.gz > "$RUNNER_TEMP/verifier" && chmod +x "$RUNNER_TEMP/verifier"
          jobs='[]'
          suites='[]'
          for s in gates/suites/*.suite.json; do
            "$RUNNER_TEMP/verifier" gate plan --suite "$s"
            jobs=$(jq -c -n --argjson a "$jobs" --argjson b "$("$RUNNER_TEMP/verifier" gate plan --suite "$s" --json)" '$a + $b')
            suites=$(jq -c -n --argjson a "$suites" --arg s "$s" '$a + [$s]')
          done
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          echo "suites=$suites" >> "$GITHUB_OUTPUT"

  shard:
    name: "${{ matrix.job.name }} ${{ matrix.job.shard }}"
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    env:
      SUITE: ${{ matrix.job.suite }}
      SHARD: ${{ matrix.job.shard }}
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: echo "::remove-matcher owner=go::"
      - name: Cache keys
        id: key
        env:
          NAME: ${{ matrix.job.name }}
        run: |
          bin=$(sha256sum bin/verifier-linux-amd64.gz | cut -c1-16)
          {
            echo "oss=gates-oss-$NAME-${SHARD/\//-of-}-"
            echo "work=gates-work-$NAME-${SHARD/\//-of-}-$bin-"
            echo "job=gates-work-$NAME-${SHARD/\//-of-}-"
          } >> "$GITHUB_OUTPUT"
      - name: Clones
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/gate/oss
          key: ${{ steps.key.outputs.oss }}${{ hashFiles('gates/suites/*.jsonl') }}
          restore-keys: ${{ steps.key.outputs.oss }}
      - name: Restore the module, build and analysis caches
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/gate/work/cache
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.key.outputs.work }}${{ github.run_id }}
          restore-keys: |
            ${{ steps.key.outputs.work }}
            ${{ steps.key.outputs.job }}
      # An analysis cache of another verifier binary never mixes with this one.
      - name: Drop an analysis cache of another binary
        if: ${{ steps.restore.outputs.cache-matched-key != '' && !startsWith(steps.restore.outputs.cache-matched-key, steps.key.outputs.work) }}
        run: rm -rf ~/gate/work/cache
      - name: Gate
        run: |
          gunzip -c bin/verifier-linux-amd64.gz > "$RUNNER_TEMP/verifier" && chmod +x "$RUNNER_TEMP/verifier"
          "$RUNNER_TEMP/verifier" gate --suite "$SUITE" --shard "$SHARD" --oss ~/gate/oss --work ~/gate/work --out "$RUNNER_TEMP/results.jsonl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gates-results-${{ matrix.job.name }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/results.jsonl
          retention-days: 30
      - name: Save the module, build and analysis caches
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/gate/work/cache
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.key.outputs.work }}${{ github.run_id }}-${{ github.run_attempt }}

  merge:
    name: "merge ${{ matrix.suite }}"
    needs: [plan, shard]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    env:
      SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Suite name
        id: suite
        run: echo "name=$(jq -r .name "$SUITE")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gates-results-${{ steps.suite.outputs.name }}-*
          path: results
      - name: Judge the whole run and commit it
        env:
          NAME: ${{ steps.suite.outputs.name }}
        run: |
          set +e
          gunzip -c bin/verifier-linux-amd64.gz > "$RUNNER_TEMP/verifier" && chmod +x "$RUNNER_TEMP/verifier"
          dest="gates/results/$NAME"
          mkdir -p "$dest"
          "$RUNNER_TEMP/verifier" gate merge --suite "$SUITE" --binary "$RUNNER_TEMP/verifier" --out "$dest/merged.jsonl" results/*/results.jsonl > "$dest/merge.out" 2>&1
          rc=$?
          echo "exit $rc" >> "$dest/merge.out"
          if [ "$BUILD" = before ]; then head -1 bin/VERSION-before > "$dest/verifier.txt"; else head -1 bin/VERSION > "$dest/verifier.txt"; fi
          summary=$(grep -E "^TOTAL|windows merged|gate passed|gate failed" "$dest/merge.out" | tr '\n' ' ' | cut -c1-900)
          echo "::notice title=gate $NAME::$summary"
          git config user.name "proto-shadow"
          git config user.email "proto-shadow@users.noreply.github.com"
          git add gates/results
          git commit -q -m "Gate $NAME of $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5 6; do
            if git pull -q --rebase origin main && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1

  scan:
    name: "scan ${{ matrix.ecosystem }} ${{ matrix.build }} with the compiler"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ecosystem: [istio, spire, linkerd, consul, lnd, dapr, containerd, authzed, temporal, etcd, crio, contour, raft, cortex, jaeger, loki, thanos]
        # new: bin/verifier-linux-amd64.gz; before: bin/verifier-before-linux-amd64.gz,
        # the verifier it replaces, so new Needs review decisions can be counted.
        build: [new, before]
    env:
      GOTOOLCHAIN: auto
      ECO: ${{ matrix.ecosystem }}
      BUILD: ${{ matrix.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: echo "::remove-matcher owner=go::"
      - name: Scan with the compiler and commit it
        run: |
          set +e
          bin=bin/verifier-linux-amd64.gz; dest="gates/results/scan-$ECO"
          if [ "$BUILD" = before ]; then bin=bin/verifier-before-linux-amd64.gz; dest="gates/results/scan-before/$ECO"; fi
          gunzip -c "$bin" > "$RUNNER_TEMP/verifier" && chmod +x "$RUNNER_TEMP/verifier"
          mkdir -p "$dest"
          "$RUNNER_TEMP/verifier" gate scan --corpus corpus.json --only "$ECO" --oracle --oss ~/scan/oss --work ~/scan/work --out "$dest/scan.jsonl" > "$RUNNER_TEMP/scan.out" 2>&1
          echo "exit $?" >> "$RUNNER_TEMP/scan.out"
          tail -c 8000 "$RUNNER_TEMP/scan.out" > "$dest/scan.out"
          version=bin/VERSION
          if [ "$BUILD" = before ]; then version=bin/VERSION-before; fi
          head -1 "$version" > "$dest/verifier.txt"
          summary=$(grep -E "decisions|failed|disagree" "$dest/scan.out" | head -3 | tr '\n' ' ' | cut -c1-900)
          echo "::notice title=scan $ECO $BUILD::$summary"
          git config user.name "proto-shadow"
          git config user.email "proto-shadow@users.noreply.github.com"
          git add gates/results
          git commit -q -m "Scan $ECO ($BUILD) with the compiler of $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5 6; do
            if git pull -q --rebase origin main && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
