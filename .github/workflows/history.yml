# On demand: mine every real upgrade of a contract module in seven projects'
# histories, let the Go compiler judge each, decide each with the pinned
# verifier, and commit the results with HISTORY.md. Each job is one
# contract -> project pair; all run at once.
name: history
on:
  push:
    paths:
      - history/request.txt
  workflow_dispatch:
    inputs:
      since:
        description: "Only upgrades from this day on (YYYY-MM-DD)"
        default: "2023-01-01"
      only:
        description: "Only these contracts (comma-separated, e.g. cri-api,otlp); empty runs all"
        default: ""
permissions:
  contents: write
concurrency: history-${{ inputs.only || github.event_name }}

jobs:
  mine:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {suite: cri-api, consumer: containerd, shard: "1/1"}
          - {suite: cri-api, consumer: cri-o, shard: "1/1"}
          - {suite: otlp, consumer: otel-go, shard: "1/1"}
          - {suite: dapr, consumer: go-sdk, shard: "1/1"}
          - {suite: lnd, consumer: lndclient, shard: "1/1"}
          - {suite: containerd-api, consumer: nerdctl, shard: "1/1"}
          # TiDB builds slowly: four machines share its compiles.
          - {suite: milvus, consumer: milvus-client, shard: "1/1"}
          - {suite: milvus, consumer: milvus-sdk-go, shard: "1/1"}
          - {suite: tipb, consumer: tidb, shard: "1/4"}
          - {suite: tipb, consumer: tidb, shard: "2/4"}
          - {suite: tipb, consumer: tidb, shard: "3/4"}
          - {suite: tipb, consumer: tidb, shard: "4/4"}
    name: "${{ matrix.suite }} -> ${{ matrix.consumer }} ${{ matrix.shard }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      # Compiler errors are data here (an upgrade that breaks the build), not
      # failures of this job: keep them out of the run's annotations.
      - run: echo "::remove-matcher owner=go::"
      - env:
          SUITE: ${{ matrix.suite }}
          CONSUMER: ${{ matrix.consumer }}
          SHARD: ${{ matrix.shard }}
          ONLY: ${{ inputs.only }}
          SINCE: ${{ inputs.since || '2023-01-01' }}
          GOTOOLCHAIN: auto
        run: bash scripts/history.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: history-${{ matrix.suite }}-${{ matrix.consumer }}-${{ strategy.job-index }}
          path: out/
          if-no-files-found: ignore
      # Each job commits its own results as soon as it ends, so a slow pair
      # never holds back the others.
      - name: Commit this pair's results
        if: always()
        env:
          SUITE: ${{ matrix.suite }}
          CONSUMER: ${{ matrix.consumer }}
          SHARD: ${{ matrix.shard }}
        run: |
          dest="history/results/$SUITE/$CONSUMER"
          mkdir -p "$dest"
          cp out/* "$dest/" 2>/dev/null || true
          git config user.name "proto-shadow"
          git config user.email "proto-shadow@users.noreply.github.com"
          git add history/results
          git diff --cached --quiet && exit 0
          git commit -q -m "History: $SUITE -> $CONSUMER ($SHARD)"
          # Only this pair's files: other jobs' commits never conflict with it.
          for i in 1 2 3 4 5 6; do
            if git pull -q --rebase origin main && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1

  scoreboard:
    needs: mine
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Rebuild HISTORY.md from every pair's results
        run: |
          git config user.name "proto-shadow"
          git config user.email "proto-shadow@users.noreply.github.com"
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase origin main || { git rebase --abort 2>/dev/null; sleep 5; continue; }
            bash scripts/history-score.sh > HISTORY.md
            git add HISTORY.md
            git diff --cached --quiet && exit 0
            git commit -q -m "HISTORY.md of $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q && exit 0
            git reset -q --soft HEAD~1
            sleep $((i * 5))
          done
          exit 1
