# On demand: mine every real upgrade of a contract module in seven projects'
# histories, let the Go compiler judge each, decide each with the pinned
# verifier, and commit the results with HISTORY.md. Each job is one
# contract -> project pair; all run at once.
name: history
on:
  workflow_dispatch:
    inputs:
      since:
        description: "Only upgrades from this day on (YYYY-MM-DD)"
        default: "2023-01-01"
permissions:
  contents: write
concurrency: history

jobs:
  mine:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {suite: cri-api, consumer: containerd}
          - {suite: cri-api, consumer: cri-o}
          - {suite: otlp, consumer: otel-go}
          - {suite: dapr, consumer: go-sdk}
          - {suite: tipb, consumer: tidb}
          - {suite: lnd, consumer: lndclient}
          - {suite: containerd-api, consumer: nerdctl}
    name: "${{ matrix.suite }} -> ${{ matrix.consumer }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      # Compiler errors are data here (an upgrade that breaks the build), not
      # failures of this job: keep them out of the run's annotations.
      - run: echo "::remove-matcher owner=go::"
      - env:
          SUITE: ${{ matrix.suite }}
          CONSUMER: ${{ matrix.consumer }}
          SINCE: ${{ inputs.since || '2023-01-01' }}
          GOTOOLCHAIN: auto
        run: bash scripts/history.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: history-${{ matrix.suite }}-${{ matrix.consumer }}
          path: out/
          if-no-files-found: ignore
      # Each job commits its own results as soon as it ends, so a slow pair
      # never holds back the others.
      - name: Commit this pair's results
        if: always()
        env:
          SUITE: ${{ matrix.suite }}
          CONSUMER: ${{ matrix.consumer }}
        run: |
          dest="history/results/$SUITE/$CONSUMER"
          mkdir -p "$dest"
          cp out/* "$dest/" 2>/dev/null || true
          bash scripts/history-score.sh > HISTORY.md
          git config user.name "proto-shadow"
          git config user.email "proto-shadow@users.noreply.github.com"
          git add history HISTORY.md
          git diff --cached --quiet && exit 0
          git commit -q -m "History: $SUITE -> $CONSUMER"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && bash scripts/history-score.sh > HISTORY.md && git add HISTORY.md && { git diff --cached --quiet || git commit -q --amend --no-edit; } && git push -q && exit 0
            sleep $((i * 7))
          done
          exit 1

