# Every hour: find the open pull requests that change a .proto file in
# the 17 projects of corpus.json, decide each with the pinned verifier, let the
# Go compiler build the real consumer against it, and commit the records.
# GitHub delays or drops scheduled runs when busy, so it is asked twice an
# hour; a pull request whose head already has a prediction is skipped.
name: shadow
on:
  schedule:
    - cron: "23,53 * * * *"
  workflow_dispatch:
    inputs:
      max_prs:
        description: "At most this many pull requests in this run"
        default: "20"
permissions:
  contents: write
concurrency: shadow

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      prs: ${{ steps.plan.outputs.prs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_PRS: ${{ inputs.max_prs || '20' }}
        run: |
          prs=$(bash scripts/plan.sh)
          echo "$prs" | jq -r '.[] | "\(.eco) #\(.n) \(.title)"'
          echo "prs=$(jq -c . <<<"$prs")" >> "$GITHUB_OUTPUT"

  predict:
    needs: plan
    if: needs.plan.outputs.prs != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        pr: ${{ fromJSON(needs.plan.outputs.prs) }}
    name: "${{ matrix.pr.eco }} #${{ matrix.pr.n }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      # Compiler errors are data here (an upgrade that breaks the build), not
      # failures of this job: keep them out of the run's annotations.
      - run: echo "::remove-matcher owner=go::"
      - env:
          PR: ${{ toJSON(matrix.pr) }}
          GOTOOLCHAIN: auto
        run: bash scripts/predict.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: record-${{ matrix.pr.key }}
          path: out/
          if-no-files-found: ignore

  record:
    needs: [plan, predict]
    if: always() && needs.plan.outputs.prs != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: record-*
          path: incoming
          merge-multiple: true
      - name: File the records and rebuild the scoreboard
        run: |
          shopt -s nullglob
          for f in incoming/*.json; do
            eco=$(jq -r .pr.eco "$f")
            mkdir -p "predictions/$eco"
            mv "$f" "predictions/$eco/"
          done
          bash scripts/score.sh > SCOREBOARD.md
          python3 scripts/front.py
          git config user.name "proto-shadow"
          git config user.email "proto-shadow@users.noreply.github.com"
          git add predictions SCOREBOARD.md README.md
          git diff --cached --quiet && exit 0
          git commit -q -m "Predictions of $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull -q --rebase origin main
          git push
